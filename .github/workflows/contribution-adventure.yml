name: Update contribution adventure

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install pinned image dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Generate the pixel-art contribution adventure
        run: python3 scripts/generate_contribution_adventure.py

      - name: Commit generated adventure assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contribution-adventure-sprites.png dist/contribution-adventure.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution adventure"
            git push
          fi
